<section class="contact-form-section" aria-label="Contact form">
  <form class="contact-form" action="https://contact.mtthw.xyz/submit" method="post">
    <div class="contact-form__row">
      <div class="contact-form__field">
        <input id="contact-name" name="name" type="text" autocomplete="name" placeholder=" " required>
        <label for="contact-name">Name</label>
      </div>
      <div class="contact-form__field">
        <input id="contact-email" name="email" type="email" autocomplete="email" placeholder=" " required>
        <label for="contact-email">Email</label>
      </div>
    </div>
    <div class="contact-form__field">
      <input id="contact-subject" name="subject" type="text" placeholder=" " required>
      <label for="contact-subject">Subject</label>
    </div>
    <div class="contact-form__field">
      <textarea id="contact-message" name="message" rows="8" minlength="64" aria-describedby="contact-message-help" placeholder=" " required></textarea>
      <label for="contact-message">Message</label>
    </div>
    <div class="contact-form__honeypot" aria-hidden="true">
      <label for="contact-company-website">Company website</label>
      <input id="contact-company-website" name="company_website" type="text" tabindex="-1" autocomplete="off">
    </div>
    <button class="contact-form__submit" type="submit">Send</button>
    <p id="form-success" class="contact-form__feedback contact-form__feedback--success" role="status" tabindex="-1"><strong>Message sent.</strong> Thank you for getting in touch.</p>
    <p id="form-error" class="contact-form__feedback contact-form__feedback--error" role="alert" tabindex="-1"><strong>Message not sent.</strong> Please try again.</p>
    <p id="form-rate-limited" class="contact-form__feedback contact-form__feedback--rate-limited" role="alert" tabindex="-1"><strong>Message limit reached.</strong> Please try again later.</p>
    <p id="form-network-error" class="contact-form__feedback contact-form__feedback--error" role="alert" tabindex="-1"><strong>Could not confirm delivery.</strong> Check your connection before trying again.</p>
  </form>
</section>
