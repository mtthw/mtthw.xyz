<!DOCTYPE html>
<html>
  {{ partial "head/head.html" . }}
   <body>
    <input type="checkbox" id="theme__checkbox" name="theme__checkbox" class="theme__checkbox" checked="true"/>
    <div class="body">
    {{ block "header" . }}
      {{ partial "header/header.html" . }}
    {{ end}}
    {{ block "main" . }}
    {{ end }}
    {{ block "footer" . }}
      {{ with .Site.GetPage "/privacy" }}
      <footer class="content site-footer">
        <div class="construction-frame site-footer__frame">
          <span class="site-footer__name">mtthw.xyz</span>
          <a href="{{ .RelPermalink }}">Privacy Policy</a>
        </div>
      </footer>
      {{ end }}
    {{ end }}
    {{ partial "sidebar/sidebar.html" . }}
    </div>
    <script type="module" src="{{ "js/navigation.js" | relURL }}"></script>
  </body>
</html>
