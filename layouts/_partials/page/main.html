{{- $hero := partial "page/hero-data.html" . -}}
<main class="content{{ if eq .Kind "404" }} not-found{{ else if not $hero.html }} content--no-hero{{ end }}" tabindex="-1">
  <div class="page-hero" data-hero-key="{{ $hero.key }}">{{ $hero.html }}</div>
  <div class="page-content">{{ partial "page/content.html" . }}</div>
</main>
