<div class="theme-toggle">
  <label class="theme-toggle__option theme-toggle__option--system" for="theme-dark" title="System theme — switch to dark">
    <span class="theme-toggle__text">System theme; switch to dark</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
      <circle cx="12" cy="12" r="8"/>
      <path d="M12 4a8 8 0 0 1 0 16V4Z" fill="currentColor" stroke="none"/>
    </svg>
  </label>
  <label class="theme-toggle__option theme-toggle__option--dark" for="theme-light" title="Dark theme — switch to light">
    <span class="theme-toggle__text">Dark theme; switch to light</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.3 15.5A8.5 8.5 0 0 1 8.5 3.7a8.5 8.5 0 1 0 11.8 11.8Z"/>
    </svg>
  </label>
  <label class="theme-toggle__option theme-toggle__option--light" for="theme-system" title="Light theme — switch to system">
    <span class="theme-toggle__text">Light theme; switch to system</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </label>
</div>
