services:
  hugo:
    # Pin both Hugo and the Dart Sass bundled in the official image.
    image: ghcr.io/gohugoio/hugo:v0.167.0@sha256:7bb99a126eddeea8fbfaacedc5ef6708805411bdeaa01e668405a137fd02d048
    entrypoint: []
    # Preserve write access to the existing source mount and cache in Colima.
    user: "0:0"
    working_dir: /src
    command:
      - hugo
      - server
      - --bind=0.0.0.0
      - --baseURL=http://localhost:1313/
      - --port=1313
      - --buildDrafts
      - --renderToMemory
      - --disableFastRender
      - --poll=1s
    environment:
      HUGO_CACHEDIR: /tmp/hugo_cache
    init: true
    ports:
      - "127.0.0.1:1313:1313"
    volumes:
      - .:/src
      - hugo_cache:/tmp/hugo_cache

volumes:
  hugo_cache:
