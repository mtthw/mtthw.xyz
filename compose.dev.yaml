services:
  hugo:
    # Keep the legacy templates and LibSass pipeline working until their upgrade.
    image: hugomods/hugo:base-0.125.7
    working_dir: /src
    command:
      - hugo
      - server
      - --bind=0.0.0.0
      - --baseURL=http://localhost:1313/
      - --port=1313
      - --buildDrafts
      - --renderToMemory
      - --disableFastRender
      - --poll=1s
    environment:
      HUGO_CACHEDIR: /tmp/hugo_cache
    init: true
    ports:
      - "127.0.0.1:1313:1313"
    volumes:
      - .:/src
      - hugo_cache:/tmp/hugo_cache

volumes:
  hugo_cache:
